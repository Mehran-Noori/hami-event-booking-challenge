services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 10

    rabbitmq:
        image: rabbitmq:4-management-alpine
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - "15672:15672"
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    web:
        image: hami-backend
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        command:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
        volumes:
            - ./app:/app
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    celery_worker:
        image: hami-backend
        restart: unless-stopped
        command:
            - celery
            - -A
            - core
            - worker
            - --loglevel=info
        volumes:
            - ./app:/app
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    celery_beat:
        image: hami-backend
        restart: unless-stopped
        command:
            - celery
            - -A
            - core
            - beat
            - --loglevel=info
        volumes:
            - ./app:/app
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
